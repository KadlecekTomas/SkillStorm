version: 2
updates:
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: daily
      time: "05:20"
      timezone: Europe/Prague
    open-pull-requests-limit: 10
    rebase-strategy: auto

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: daily
      time: "05:35"
      timezone: Europe/Prague
    open-pull-requests-limit: 10
    rebase-strategy: auto

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:50"
      timezone: Europe/Prague
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
      day: monday
      time: "06:05"
      timezone: Europe/Prague
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /client
    schedule:
      interval: weekly
      day: monday
      time: "06:20"
      timezone: Europe/Prague
    open-pull-requests-limit: 5
