version: 2

updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Prague
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    rebase-strategy: auto
    groups:
      client-non-major:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Europe/Prague
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    rebase-strategy: auto
    groups:
      server-non-major:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Prague
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    rebase-strategy: auto
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /client
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Europe/Prague
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    rebase-strategy: auto

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Prague
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    rebase-strategy: auto
