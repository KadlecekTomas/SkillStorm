name: Temporary school UX frontend verification

on:
  push:
    branches: [fix/school-readiness-rbac-contracts]
    paths: [.github/workflows/ux-final-frontend-verify.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/school-readiness-rbac-contracts
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Apply final interaction fix and harden regression matcher
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          detail = Path("client/src/app/(school)/app/tests/[testId]/page.tsx")
          detail_text = detail.read_text()
          old_action = '''        <Link href="/app/tests">\n          <Button variant="outline">Zpět na testy</Button>\n        </Link>'''
          new_action = '''        <Button asChild variant="outline">\n          <Link href="/app/tests">Zpět na testy</Link>\n        </Button>'''
          if detail_text.count(old_action) != 1:
              raise SystemExit(f"remaining nested test action count: {detail_text.count(old_action)}")
          detail.write_text(detail_text.replace(old_action, new_action, 1))

          test = Path("client/src/tests/ux-action-integrity.spec.ts")
          test_text = test.read_text()
          old_matcher = '  const nestedInteractive = /<Link\\b[^>]*>[\\s\\S]*?<Button\\b[\\s\\S]*?<\\/Link>/;'
          new_matcher = '  const nestedInteractive = /<Link\\b[^>]*>(?:(?!<\\/Link>)[\\s\\S])*?<Button\\b(?:(?!<\\/Link>)[\\s\\S])*?<\\/Link>/;'
          if test_text.count(old_matcher) != 1:
              raise SystemExit(f"nested matcher count: {test_text.count(old_matcher)}")
          test.write_text(test_text.replace(old_matcher, new_matcher, 1))
          PY

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Lint frontend
        working-directory: client
        run: npm run lint

      - name: Typecheck frontend
        working-directory: client
        run: npm run typecheck

      - name: Run frontend unit tests
        working-directory: client
        run: npm run test:unit

      - name: Build frontend
        working-directory: client
        env:
          NODE_ENV: production
          API_PROXY_TARGET: http://localhost:4200
        run: npm run build

      - name: Commit verified fix and remove helper
        shell: bash
        run: |
          rm .github/workflows/ux-final-frontend-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/app/\(school\)/app/tests/\[testId\]/page.tsx \
                  client/src/tests/ux-action-integrity.spec.ts \
                  .github/workflows/ux-final-frontend-verify.yml
          git commit -m "test(ux): lock school action integrity"
          git push origin HEAD:fix/school-readiness-rbac-contracts
