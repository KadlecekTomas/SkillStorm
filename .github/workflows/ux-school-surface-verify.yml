name: Temporary school UI surface verification

on:
  push:
    branches: [fix/school-readiness-rbac-contracts]
    paths: [.github/workflows/ux-school-surface-verify.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/school-readiness-rbac-contracts
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Lint frontend
        working-directory: client
        run: npm run lint

      - name: Typecheck frontend
        working-directory: client
        run: npm run typecheck

      - name: Run frontend unit tests
        working-directory: client
        run: npm run test:unit

      - name: Build frontend
        working-directory: client
        env:
          NODE_ENV: production
          API_PROXY_TARGET: http://localhost:4200
        run: npm run build

      - name: Remove helper after verified gate
        shell: bash
        run: |
          rm .github/workflows/ux-school-surface-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ux-school-surface-verify.yml
          git commit -m "chore(ux): remove temporary school UI verifier"
          git push origin HEAD:fix/school-readiness-rbac-contracts
