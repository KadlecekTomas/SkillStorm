name: D3 Build PC Motion Repair

on:
  push:
    branches:
      - feature/d3-build-a-pc-ui-slice
    paths:
      - scripts/repair-build-pc-motion-drag.mjs
      - .github/workflows/d3-build-pc-motion-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/d3-build-a-pc-ui-slice
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - working-directory: client
        run: npm ci
      - run: node scripts/repair-build-pc-motion-drag.mjs
      - working-directory: client
        run: npm run typecheck
      - name: Commit repair and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/it-lab/build-pc/BuildPcLab.tsx
          git rm scripts/repair-build-pc-motion-drag.mjs .github/workflows/d3-build-pc-motion-repair.yml
          git commit -m "fix(it-lab): keep native drag compatible with motion"
          git push origin HEAD:feature/d3-build-a-pc-ui-slice
