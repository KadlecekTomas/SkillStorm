name: Activity D2-A Schema Bootstrap

on:
  push:
    branches:
      - agent/lesson-experience-d2
    paths:
      - scripts/internal/apply-activity-d2a-schema.mjs
      - .github/workflows/activity-d2a-schema-bootstrap.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/lesson-experience-d2
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply Activity schema and migration
        run: node scripts/internal/apply-activity-d2a-schema.mjs
      - name: Validate production-only result
        run: |
          git diff --check
          test ! -f scripts/internal/apply-activity-d2a-schema.mjs
          test ! -f .github/workflows/activity-d2a-schema-bootstrap.yml
          test -f server/prisma/migrations/20260809010500_activity_engine_d2a/migration.sql
          grep -q 'model ActivityVersion {' server/prisma/schema.prisma
          grep -q 'ACTIVITY_VERSION_CONTENT_IMMUTABLE' server/prisma/migrations/20260809010500_activity_engine_d2a/migration.sql
          grep -q 'ACTIVITY_MAPPING_VERSION_FROZEN' server/prisma/migrations/20260809010500_activity_engine_d2a/migration.sql
      - name: Commit production-only result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(activity): add D2-A schema and DB invariants"
          git push origin HEAD:agent/lesson-experience-d2
