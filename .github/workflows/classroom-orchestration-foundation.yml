name: Classroom Orchestration Foundation

on:
  pull_request:
    paths:
      - 'server/prisma/schema.prisma'
      - 'server/prisma/migrations/**classroom_orchestration**/**'
      - 'server/src/classroom-orchestration/**'
      - 'server/src/live-sessions/**'
      - 'server/src/app.module.ts'
      - 'server/test/e2e/classroom-orchestration.e2e-spec.ts'
      - 'server/test/e2e/live-sessions.e2e-spec.ts'
      - '.github/workflows/classroom-orchestration-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'server/prisma/schema.prisma'
      - 'server/prisma/migrations/**classroom_orchestration**/**'
      - 'server/src/classroom-orchestration/**'
      - 'server/src/live-sessions/**'
      - 'server/src/app.module.ts'
      - 'server/test/e2e/classroom-orchestration.e2e-spec.ts'
      - 'server/test/e2e/live-sessions.e2e-spec.ts'
      - '.github/workflows/classroom-orchestration-foundation.yml'

permissions:
  contents: read

jobs:
  classroom-orchestration-foundation:
    name: Classroom D2-C invariants
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skillstorm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d skillstorm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skillstorm_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/skillstorm_test
      JWT_SECRET: classroom-ci-only
      NODE_ENV: test
      PORT: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npm run prisma:generate

      - name: Validate Prisma schema
        working-directory: server
        run: npx prisma validate

      - name: Deploy all migrations on clean PostgreSQL
        working-directory: server
        run: npx prisma migrate deploy

      - name: Strict backend typecheck
        working-directory: server
        run: npm run typecheck

      - name: Semantic privacy and telemetry policy
        working-directory: server
        run: npm test -- classroom-orchestration.constants.spec.ts --runInBand

      - name: Preserve legacy BOARD_ONLY Bleskovka
        working-directory: server
        run: npx jest --config ./test/jest-e2e.config.js --testPathPattern='live-sessions.e2e-spec.ts' --runInBand

      - name: Run D2-C 30-participant orchestration simulation
        working-directory: server
        run: npx jest --config ./test/jest-e2e.config.js --testPathPattern='classroom-orchestration.e2e-spec.ts' --runInBand
