name: Runtime Supply Chain Certification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Gitleaks secret gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact candidate commit with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks with checksum verification
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Resolve commit range for secret scanning
        id: secret-range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero_sha="0000000000000000000000000000000000000000"
          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]]; then
            base="$PR_BASE_SHA"
          elif [[ -n "$EVENT_BEFORE_SHA" && "$EVENT_BEFORE_SHA" != "$zero_sha" ]]; then
            base="$EVENT_BEFORE_SHA"
          else
            base="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi

          if [[ "$base" == "$GITHUB_SHA" ]]; then
            echo "range=--all" >> "$GITHUB_OUTPUT"
          else
            echo "range=${base}..${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
          echo "gitleaks_base=$base"
          echo "gitleaks_head=$GITHUB_SHA"

      - name: Block newly introduced secrets
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git \
            --redact \
            --verbose \
            --report-format json \
            --report-path gitleaks-report.json \
            --log-opts="${{ steps.secret-range.outputs.range }}" \
            .

      - name: Upload Gitleaks evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn
          retention-days: 21

  sast:
    name: Semgrep CE SAST gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact candidate commit with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Semgrep CE
        run: python -m pip install --disable-pip-version-check "semgrep==1.172.0"

      - name: Resolve SAST baseline
        id: sast-baseline
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero_sha="0000000000000000000000000000000000000000"
          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]]; then
            base="$PR_BASE_SHA"
          elif [[ -n "$EVENT_BEFORE_SHA" && "$EVENT_BEFORE_SHA" != "$zero_sha" ]]; then
            base="$EVENT_BEFORE_SHA"
          else
            base="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "semgrep_base=$base"
          echo "semgrep_head=$GITHUB_SHA"

      - name: Block newly introduced SAST findings
        if: github.actor != 'dependabot[bot]'
        shell: bash
        env:
          SEMGREP_ENABLE_VERSION_CHECK: "0"
        run: |
          set -euo pipefail
          semgrep scan \
            --config auto \
            --baseline-commit "${{ steps.sast-baseline.outputs.base }}" \
            --error \
            --sarif-output semgrep.sarif \
            .

      - name: Explain Dependabot SAST skip
        if: github.actor == 'dependabot[bot]'
        run: echo "Semgrep CE is skipped for Dependabot-only dependency PRs; Gitleaks, Trivy and runtime dependency audits still run."

      - name: Upload Semgrep evidence
        if: always() && github.actor != 'dependabot[bot]'
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sast-report
          path: semgrep.sarif
          if-no-files-found: warn
          retention-days: 21

  trivy-repository:
    name: Trivy HIGH/CRITICAL gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4

      - name: Scan dependencies and IaC with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  runtime-audit:
    name: Runtime audit (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            directory: server
          - app: frontend
            directory: client

    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4

      - name: Setup supported production Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Audit production dependency graph
        id: audit
        shell: bash
        working-directory: ${{ matrix.directory }}
        run: |
          set +e
          npm audit --omit=dev --audit-level=critical --json > runtime-audit.json
          status=$?
          set -e

          node <<'NODE'
          const fs = require('node:fs');
          const path = 'runtime-audit.json';
          let report;
          try {
            report = JSON.parse(fs.readFileSync(path, 'utf8'));
          } catch (error) {
            console.error(`Unable to parse ${path}:`, error);
            process.exit(2);
          }

          const v = report?.metadata?.vulnerabilities ?? {};
          const summary = {
            info: v.info ?? 0,
            low: v.low ?? 0,
            moderate: v.moderate ?? 0,
            high: v.high ?? 0,
            critical: v.critical ?? 0,
            total: v.total ?? 0,
          };
          console.log('RUNTIME_AUDIT=' + JSON.stringify(summary));
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `### Runtime dependency audit — ${process.env.AUDIT_APP}\n\n` +
              `| Severity | Count |\n|---|---:|\n` +
              `| Critical | ${summary.critical} |\n` +
              `| High | ${summary.high} |\n` +
              `| Moderate | ${summary.moderate} |\n` +
              `| Low | ${summary.low} |\n` +
              `| **Total** | **${summary.total}** |\n\n` +
              `Current hard release threshold: **critical**. Trivy independently blocks HIGH/CRITICAL repository findings.\n`,
          );
          NODE

          if [[ "$status" -ne 0 ]]; then
            echo "Critical runtime vulnerability threshold failed for $AUDIT_APP."
            exit "$status"
          fi
        env:
          AUDIT_APP: ${{ matrix.app }}

      - name: Upload machine-readable runtime audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-audit-${{ matrix.app }}
          path: ${{ matrix.directory }}/runtime-audit.json
          if-no-files-found: error
          retention-days: 21
