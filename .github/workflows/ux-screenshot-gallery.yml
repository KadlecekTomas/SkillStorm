name: Temporary UX screenshot gallery

on:
  push:
    branches:
      - fix/school-readiness-rbac-contracts

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skillstorm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d skillstorm_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@127.0.0.1:5432/skillstorm_test?schema=public
      JWT_SECRET: screenshot-gallery-secret
      API_PROXY_TARGET: http://127.0.0.1:4200
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/school-readiness-rbac-contracts

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Prisma generate
        working-directory: server
        run: npx prisma generate

      - name: Migrate test database before web server starts
        working-directory: server
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
        run: npx prisma migrate deploy

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Install Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Add focused screenshot scenario and config
        working-directory: client
        shell: bash
        run: |
          cat > tests/scenarios/ux-screenshot-gallery.scenario.ts <<'EOF'
          import { test, expect, type Browser, type Page } from '@playwright/test';
          import { mkdirSync } from 'node:fs';
          import { join } from 'node:path';
          import { loadManifest } from './manifest';

          const OUT = join(process.cwd(), 'artifacts', 'ux-screenshots');
          mkdirSync(OUT, { recursive: true });

          async function openAs(browser: Browser, email: string, organizationId: string, password: string) {
            const context = await browser.newContext({
              baseURL: 'http://127.0.0.1:3001',
              viewport: { width: 1440, height: 1000 },
              extraHTTPHeaders: {
                'X-Forwarded-For': `10.99.${Math.floor(Math.random() * 200) + 1}.${Math.floor(Math.random() * 200) + 1}`,
              },
            });
            const login = await context.request.post('/api/auth/login', {
              data: { email, password, organizationId },
            });
            expect(login.ok(), `login for ${email}`).toBeTruthy();
            const page = await context.newPage();
            return { context, page };
          }

          async function capture(page: Page, name: string, url: string, marker?: RegExp) {
            await page.goto(url, { waitUntil: 'commit' });
            await page.waitForLoadState('domcontentloaded');
            if (marker) {
              await expect(page.getByText(marker).first()).toBeVisible({ timeout: 15000 });
            }
            await page.waitForTimeout(700);
            await page.screenshot({ path: join(OUT, `${name}.png`), fullPage: true });
          }

          test('UX screenshot gallery', async ({ browser }) => {
            const m = loadManifest();

            const teacher = await openAs(browser, m.accounts.teacher, m.orgId, m.password);
            await capture(teacher.page, '01-ucitel-dashboard', '/app');
            await capture(teacher.page, '02-ucitel-zadani', '/app/assignments');
            await capture(teacher.page, '03-ucitel-vysledky-pdf', '/app/results', /Tisk \/ uložit PDF/i);
            await capture(teacher.page, '04-ucitel-knihovna', '/app/library');
            await teacher.context.close();

            const director = await openAs(browser, m.accounts.director, m.orgId, m.password);
            await capture(director.page, '05-reditel-dashboard', '/app');
            await capture(director.page, '06-reditel-tridy', '/app/classrooms');
            await capture(director.page, '07-reditel-ucitele', '/app/settings/teachers');
            await director.context.close();

            const student = await openAs(browser, m.accounts.student8a, m.orgId, m.password);
            await capture(student.page, '08-zak-zadani', '/app/assignments');
            await capture(student.page, '09-zak-analytika', '/app/student/analytics');
            await student.context.close();

            const parent = await openAs(browser, m.accounts.parent, m.orgId, m.password);
            await capture(parent.page, '10-rodic-rodinny-prostor', '/app/family', /Moje děti/i);
            await parent.context.close();
          });
          EOF

          cat > playwright.ux-screenshots.config.ts <<'EOF'
          import { defineConfig, devices } from '@playwright/test';

          const E2E_DATABASE_URL =
            process.env.DATABASE_URL_TEST ||
            'postgresql://postgres:postgres@127.0.0.1:5432/skillstorm_test?schema=public';

          const { DATABASE_URL: _ignored, ...rawAmbient } = process.env;
          const ambientEnv = Object.fromEntries(
            Object.entries(rawAmbient).filter(([, value]) => value !== undefined),
          ) as Record<string, string>;

          export default defineConfig({
            testDir: './tests/scenarios',
            testMatch: /ux-screenshot-gallery\.scenario\.ts/,
            workers: 1,
            fullyParallel: false,
            timeout: 120_000,
            expect: { timeout: 15_000 },
            globalSetup: require.resolve('./tests/scenarios/global-setup.ts'),
            use: {
              ...devices['Desktop Chrome'],
              baseURL: 'http://127.0.0.1:3001',
              headless: true,
            },
            webServer: [
              {
                command: 'npm --prefix ../server run start:e2e',
                url: 'http://127.0.0.1:4200/health',
                reuseExistingServer: false,
                timeout: 180_000,
                env: {
                  ...ambientEnv,
                  NODE_ENV: 'development',
                  PORT: '4200',
                  JWT_SECRET: process.env.JWT_SECRET || 'screenshot-gallery-secret',
                  DATABASE_URL: E2E_DATABASE_URL,
                  DISABLE_CSRF: '1',
                  DISABLE_THROTTLE: '0',
                  TRUST_PROXY: '1',
                },
              },
              {
                command: 'npm run dev -- --hostname 127.0.0.1 --port 3001',
                url: 'http://127.0.0.1:3001',
                reuseExistingServer: false,
                timeout: 180_000,
                env: {
                  ...ambientEnv,
                  PORT: '3001',
                  API_PROXY_TARGET: 'http://127.0.0.1:4200',
                },
              },
            ],
          });
          EOF

      - name: Capture screenshot gallery
        working-directory: client
        run: npx playwright test --config=playwright.ux-screenshots.config.ts

      - name: Upload screenshot gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skillstorm-school-ui-screenshots
          path: client/artifacts/ux-screenshots/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ux-screenshot-gallery.yml
          git commit -m "chore(ux): remove temporary screenshot gallery workflow"
          git push origin HEAD:fix/school-readiness-rbac-contracts
