name: Temporary test detail UX fix

on:
  push:
    branches: [fix/school-readiness-rbac-contracts]
    paths: [.github/workflows/ux-test-detail-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/school-readiness-rbac-contracts
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Apply exact test-detail UX fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("client/src/app/(school)/app/tests/[testId]/page.tsx")
          text = path.read_text()

          old_log = '''        if (found) {\n          console.log("assignment.openAt raw:", found.openAt);\n        }\n        setAssignment(found);'''
          if text.count(old_log) != 1:
              raise SystemExit(f"debug-log block match count: {text.count(old_log)}")
          text = text.replace(old_log, '        setAssignment(found);', 1)

          old_link = '<Link href="/app/tests"><Button variant="outline">Zpět na testy</Button></Link>'
          new_link = '''<Button asChild variant="outline">\n          <Link href="/app/tests">Zpět na testy</Link>\n        </Button>'''
          count = text.count(old_link)
          if count != 6:
              raise SystemExit(f"nested Link/Button match count: {count}")
          text = text.replace(old_link, new_link)

          path.write_text(text)
          PY

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Lint frontend
        working-directory: client
        run: npm run lint

      - name: Typecheck frontend
        working-directory: client
        run: npm run typecheck

      - name: Commit verified fix and remove helper
        shell: bash
        run: |
          rm .github/workflows/ux-test-detail-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/app/\(school\)/app/tests/\[testId\]/page.tsx \
                  .github/workflows/ux-test-detail-fix.yml
          git commit -m "fix(ux): clean test detail error actions"
          git push origin HEAD:fix/school-readiness-rbac-contracts
