name: Classroom D2-C Legacy Repair

on:
  push:
    branches:
      - agent/classroom-orchestration-d2c
    paths:
      - 'scripts/patch-live-sessions-d2c.mjs'
      - '.github/workflows/classroom-d2c-legacy-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    name: Patch and typecheck legacy LiveSession boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skillstorm_test

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/classroom-orchestration-d2c
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npm run prisma:generate

      - name: Apply legacy LiveSession boundary patch
        run: node scripts/patch-live-sessions-d2c.mjs

      - name: Strict backend typecheck
        working-directory: server
        run: npm run typecheck

      - name: Commit repair and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/live-sessions/live-sessions.service.ts
          git rm scripts/patch-live-sessions-d2c.mjs .github/workflows/classroom-d2c-legacy-repair.yml
          git commit -m "fix(classroom): preserve legacy LiveSession boundary"
          git push origin HEAD:agent/classroom-orchestration-d2c
