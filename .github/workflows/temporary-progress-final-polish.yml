name: Temporary progress final polish

on:
  push:
    branches:
      - fix/school-readiness-rbac-contracts
    paths:
      - '.github/workflows/temporary-progress-final-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/school-readiness-rbac-contracts
          fetch-depth: 0

      - name: Remove avoidable dead-end interactions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('client/src/app/(school)/app/progress/page.tsx')
          text = page.read_text()

          old = '''    if (attendanceStatus === "LATE" && minutesLate) {
      const parsedMinutes = Number(minutesLate);
      if (!Number.isInteger(parsedMinutes) || parsedMinutes < 1 || parsedMinutes > 1440) {
        setError("Zadejte počet minut zpoždění jako celé číslo od 1 do 1440.");
        return;
      }
    }'''
          new = '''    if (attendanceStatus === "LATE") {
      const parsedMinutes = Number(minutesLate);
      if (!minutesLate || !Number.isInteger(parsedMinutes) || parsedMinutes < 1 || parsedMinutes > 1440) {
        setError("Zadejte počet minut zpoždění jako celé číslo od 1 do 1440.");
        return;
      }
    }'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('late attendance validation marker not found')

          old = '''          {mode === "ATTENDANCE" && (
            <div className="space-y-5">
              <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">'''
          new = '''          {mode === "ATTENDANCE" && (
            <div className="space-y-5">
              {!online && (
                <div role="status" className="flex items-start gap-3 rounded-xl border border-warning/40 bg-warning-soft p-4 font-semibold text-ink">
                  <CloudOff className="mt-0.5 h-5 w-5 shrink-0" />
                  Docházka se ukládá přímo do školního systému a vyžaduje připojení k internetu. Hodnocení můžete dál zapisovat offline.
                </div>
              )}
              <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('attendance offline notice marker not found')

          old = 'disabled={busy || !selectedStudent} onClick={() => void saveAttendance()}'
          new = 'disabled={busy || !selectedStudent || !online} onClick={() => void saveAttendance()}'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('attendance disabled marker not found')

          old = '''          {mode === "SUPPORT" && (
            <div className="space-y-5">
              <div className="rounded-xl border border-warning/40 bg-warning-soft p-4 text-sm leading-relaxed text-ink">'''
          new = '''          {mode === "SUPPORT" && (
            <div className="space-y-5">
              {!online && (
                <div role="status" className="flex items-start gap-3 rounded-xl border border-warning/40 bg-warning-soft p-4 font-semibold text-ink">
                  <CloudOff className="mt-0.5 h-5 w-5 shrink-0" />
                  Podpůrná opatření vyžadují připojení k internetu. Rozpracovaný text na této obrazovce nemažte, po připojení ho můžete uložit.
                </div>
              )}
              <div className="rounded-xl border border-warning/40 bg-warning-soft p-4 text-sm leading-relaxed text-ink">'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('support offline notice marker not found')

          old = 'disabled={busy || !selectedStudent || !interventionTitle.trim()} onClick={() => void saveIntervention()}'
          new = 'disabled={busy || !selectedStudent || !interventionTitle.trim() || !online} onClick={() => void saveIntervention()}'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('support disabled marker not found')

          old = '''          </div>

          {mode === "ASSESSMENT" && ('''
          new = '''          </div>

          {selectedClass && selectedClass.students.length === 0 && (
            <div role="status" className="rounded-xl border border-warning/40 bg-warning-soft p-4 font-semibold text-ink">
              V této třídě zatím nejsou žádní aktivní žáci. Vyberte jinou třídu, nebo požádejte vedení o kontrolu zařazení žáků.
            </div>
          )}

          {mode === "ASSESSMENT" && ('''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('empty class state marker not found')

          page.write_text(text)

          test = Path('client/src/tests/progress-responsive-contract.spec.ts')
          source = test.read_text()
          source = source.replace(
              'expect(source).toContain("disabled={busy || !selectedStudent} onClick={() => void saveAttendance()}");',
              'expect(source).toContain("disabled={busy || !selectedStudent || !online} onClick={() => void saveAttendance()}");',
          )
          source = source.replace(
              'expect(source).toContain("disabled={busy || !selectedStudent || !interventionTitle.trim()} onClick={() => void saveIntervention()}");',
              'expect(source).toContain("disabled={busy || !selectedStudent || !interventionTitle.trim() || !online} onClick={() => void saveIntervention()}");',
          )
          anchor = 'expect(source).toContain("Zadejte počet minut zpoždění jako celé číslo od 1 do 1440.");'
          if 'Docházka se ukládá přímo do školního systému' not in source:
              source = source.replace(
                  anchor,
                  anchor + '\n      expect(source).toContain("Docházka se ukládá přímo do školního systému");\n      expect(source).toContain("Podpůrná opatření vyžadují připojení k internetu");\n      expect(source).toContain("V této třídě zatím nejsou žádní aktivní žáci");',
                  1,
              )
          test.write_text(source)
          PY

      - name: Verify final interaction contracts
        working-directory: client
        run: |
          npm ci
          npx vitest run src/tests/progress-responsive-contract.spec.ts src/tests/ux-action-integrity.spec.ts
          npm run typecheck

      - name: Commit final interaction polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/app/'(school)'/app/progress/page.tsx client/src/tests/progress-responsive-contract.spec.ts
          if git diff --cached --quiet; then
            echo "Final progress polish already applied"
            exit 0
          fi
          git commit -m "fix(progress): eliminate offline dead-end actions"
          git pull --rebase origin fix/school-readiness-rbac-contracts
          git push origin HEAD:fix/school-readiness-rbac-contracts
