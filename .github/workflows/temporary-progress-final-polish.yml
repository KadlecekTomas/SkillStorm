name: Temporary progress final polish

on:
  push:
    branches:
      - fix/school-readiness-rbac-contracts
    paths:
      - '.github/workflows/temporary-progress-final-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/school-readiness-rbac-contracts
          fetch-depth: 0

      - name: Remove avoidable dead-end interactions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('client/src/app/(school)/app/progress/page.tsx')
          text = page.read_text()
          def swap(old, new, label):
              global text
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'marker not found: {label}')
          swap('    if (attendanceStatus === "LATE" && minutesLate) {\n      const parsedMinutes = Number(minutesLate);\n      if (!Number.isInteger(parsedMinutes) || parsedMinutes < 1 || parsedMinutes > 1440) {\n        setError("Zadejte počet minut zpoždění jako celé číslo od 1 do 1440.");\n        return;\n      }\n    }', '    if (attendanceStatus === "LATE") {\n      const parsedMinutes = Number(minutesLate);\n      if (!minutesLate || !Number.isInteger(parsedMinutes) || parsedMinutes < 1 || parsedMinutes > 1440) {\n        setError("Zadejte počet minut zpoždění jako celé číslo od 1 do 1440.");\n        return;\n      }\n    }', 'late validation')
          swap('          {mode === "ATTENDANCE" && (\n            <div className="space-y-5">\n              <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">', '          {mode === "ATTENDANCE" && (\n            <div className="space-y-5">\n              {!online && (\n                <div role="status" className="flex items-start gap-3 rounded-xl border border-warning/40 bg-warning-soft p-4 font-semibold text-ink">\n                  <CloudOff className="mt-0.5 h-5 w-5 shrink-0" />\n                  Docházka se ukládá přímo do školního systému a vyžaduje připojení k internetu. Hodnocení můžete dál zapisovat offline.\n                </div>\n              )}\n              <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">', 'attendance offline notice')
          swap('disabled={busy || !selectedStudent} onClick={() => void saveAttendance()}', 'disabled={busy || !selectedStudent || !online} onClick={() => void saveAttendance()}', 'attendance disabled')
          swap('          {mode === "SUPPORT" && (\n            <div className="space-y-5">\n              <div className="rounded-xl border border-warning/40 bg-warning-soft p-4 text-sm leading-relaxed text-ink">', '          {mode === "SUPPORT" && (\n            <div className="space-y-5">\n              {!online && (\n                <div role="status" className="flex items-start gap-3 rounded-xl border border-warning/40 bg-warning-soft p-4 font-semibold text-ink">\n                  <CloudOff className="mt-0.5 h-5 w-5 shrink-0" />\n                  Podpůrná opatření vyžadují připojení k internetu. Rozpracovaný text na této obrazovce nemažte, po připojení ho můžete uložit.\n                </div>\n              )}\n              <div className="rounded-xl border border-warning/40 bg-warning-soft p-4 text-sm leading-relaxed text-ink">', 'support offline notice')
          swap('disabled={busy || !selectedStudent || !interventionTitle.trim()} onClick={() => void saveIntervention()}', 'disabled={busy || !selectedStudent || !interventionTitle.trim() || !online} onClick={() => void saveIntervention()}', 'support disabled')
          swap('          </div>\n\n          {mode === "ASSESSMENT" && (', '          </div>\n\n          {selectedClass && selectedClass.students.length === 0 && (\n            <div role="status" className="rounded-xl border border-warning/40 bg-warning-soft p-4 font-semibold text-ink">\n              V této třídě zatím nejsou žádní aktivní žáci. Vyberte jinou třídu, nebo požádejte vedení o kontrolu zařazení žáků.\n            </div>\n          )}\n\n          {mode === "ASSESSMENT" && (', 'empty class state')
          page.write_text(text)
          test = Path('client/src/tests/progress-responsive-contract.spec.ts')
          source = test.read_text()
          source = source.replace('expect(source).toContain("disabled={busy || !selectedStudent} onClick={() => void saveAttendance()}");', 'expect(source).toContain("disabled={busy || !selectedStudent || !online} onClick={() => void saveAttendance()}");')
          source = source.replace('expect(source).toContain("disabled={busy || !selectedStudent || !interventionTitle.trim()} onClick={() => void saveIntervention()}");', 'expect(source).toContain("disabled={busy || !selectedStudent || !interventionTitle.trim() || !online} onClick={() => void saveIntervention()}");')
          anchor = 'expect(source).toContain("Zadejte počet minut zpoždění jako celé číslo od 1 do 1440.");'
          extra = anchor + '\n      expect(source).toContain("Docházka se ukládá přímo do školního systému");\n      expect(source).toContain("Podpůrná opatření vyžadují připojení k internetu");\n      expect(source).toContain("V této třídě zatím nejsou žádní aktivní žáci");'
          if 'Docházka se ukládá přímo do školního systému' not in source:
              if anchor not in source:
                  raise SystemExit('test anchor not found')
              source = source.replace(anchor, extra, 1)
          test.write_text(source)
          PY

      - name: Verify final interaction contracts
        working-directory: client
        run: |
          npm ci
          npx vitest run src/tests/progress-responsive-contract.spec.ts src/tests/ux-action-integrity.spec.ts
          npm run typecheck

      - name: Commit final interaction polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/app/'(school)'/app/progress/page.tsx client/src/tests/progress-responsive-contract.spec.ts
          if git diff --cached --quiet; then
            echo "Final progress polish already applied"
            exit 0
          fi
          git commit -m "fix(progress): eliminate offline dead-end actions"
          git pull --rebase origin fix/school-readiness-rbac-contracts
          git push origin HEAD:fix/school-readiness-rbac-contracts
