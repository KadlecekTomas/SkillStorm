name: Classroom D2-C Bootstrap

on:
  push:
    branches:
      - agent/classroom-orchestration-d2c
    paths:
      - 'scripts/bootstrap-classroom-d2c.mjs'
      - '.github/workflows/classroom-d2c-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    name: Validate and commit D2-C schema
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skillstorm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d skillstorm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skillstorm_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/skillstorm_test

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/classroom-orchestration-d2c
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Apply D2-C schema bootstrap
        run: node scripts/bootstrap-classroom-d2c.mjs

      - name: Format Prisma schema
        working-directory: server
        run: npx prisma format

      - name: Generate Prisma client
        working-directory: server
        run: npm run prisma:generate

      - name: Validate Prisma schema
        working-directory: server
        run: npx prisma validate

      - name: Deploy all migrations on clean PostgreSQL
        working-directory: server
        run: npx prisma migrate deploy

      - name: Commit validated production files and remove bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/prisma/schema.prisma server/prisma/migrations/20260809110000_classroom_orchestration_d2c/migration.sql
          git rm scripts/bootstrap-classroom-d2c.mjs .github/workflows/classroom-d2c-bootstrap.yml
          git commit -m "feat(classroom): add D2-C orchestration schema"
          git push origin HEAD:agent/classroom-orchestration-d2c
