name: Curriculum Resolution Bootstrap

on:
  push:
    branches:
      - agent/curriculum-foundation-d1
    paths:
      - scripts/internal/finalize-curriculum-resolution.mjs
      - .github/workflows/curriculum-resolution-bootstrap.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/curriculum-foundation-d1
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply exact resolver hardening
        run: node scripts/internal/finalize-curriculum-resolution.mjs
      - name: Validate production-only result
        run: |
          git diff --check
          test ! -f scripts/internal/finalize-curriculum-resolution.mjs
          test ! -f .github/workflows/curriculum-resolution-bootstrap.yml
          grep -q 'CURRICULUM_MAPPING_ASPECT_RETIRED' server/src/curriculum/curriculum.service.ts
          grep -q 'CURRICULUM_RESOLUTION_DATE_OUTSIDE_ACADEMIC_YEAR' server/src/curriculum/curriculum.service.ts
          grep -q 'asOf?: string' server/src/curriculum/dto/curriculum.dto.ts
      - name: Commit production-only result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(curriculum): harden historical resolution and aspect lifecycle"
          git push origin HEAD:agent/curriculum-foundation-d1
