name: Temporary school readiness browser gate

on:
  push:
    branches: [fix/school-readiness-rbac-contracts]
    paths: [.github/workflows/ux-school-browser-gate.yml]

permissions:
  contents: write

concurrency:
  group: skillstorm-school-ux-browser-gate
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/skillstorm_test
  JWT_SECRET: ciSyntheticAccessSecret1234567890abcdef
  JWT_ACCESS_SECRET: ciSyntheticAccessSecret1234567890abcdef
  JWT_REFRESH_SECRET: ciSyntheticRefreshSecret1234567890abcdef
  COOKIE_SECRET: ciSyntheticCookieSecret1234567890abcdef
  METRICS_INGEST_KEY: ciSyntheticMetricsKey1234567890abcdef
  CORS_ORIGINS: http://127.0.0.1:3001,http://localhost:3001
  PUBLIC_APP_URL: http://127.0.0.1:3001
  API_URL: http://127.0.0.1:4200
  API_PROXY_TARGET: http://127.0.0.1:4200
  BASE_URL: http://127.0.0.1:3001
  DISABLE_THROTTLE: "0"
  TRUST_PROXY: "1"
  DISABLE_CSRF: "1"
  CI: "true"

jobs:
  browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skillstorm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d skillstorm_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/school-readiness-rbac-contracts
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Align browser contract with truthful PDF action and lock header policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          scenario = Path("client/tests/scenarios/school-readiness.scenario.ts")
          text = scenario.read_text()
          old_title = "teacher diagnostics load without 403 and Export PDF invokes the print-to-PDF action"
          new_title = "teacher diagnostics load without 403 and Tisk / uložit PDF invokes browser print"
          if text.count(old_title) != 1:
              raise SystemExit(f"scenario title match count: {text.count(old_title)}")
          text = text.replace(old_title, new_title, 1)
          old_locator = "page.getByRole('button', { name: 'Export PDF' })"
          new_locator = "page.getByRole('button', { name: 'Tisk / uložit PDF' })"
          if text.count(old_locator) != 1:
              raise SystemExit(f"PDF locator match count: {text.count(old_locator)}")
          scenario.write_text(text.replace(old_locator, new_locator, 1))

          policy = Path("client/src/tests/ux-school-surface-policy.spec.ts")
          policy_text = policy.read_text()
          marker = '''  it("heatmap vedení neprezentuje API chybu jako legitimně prázdná data", () => {\n    const text = source("src/app/(school)/app/analytics/class-heatmap/page.tsx");\n\n    expect(text).toContain("Přehled výsledků tříd se nepodařilo načíst.");\n    expect(text).toContain("Zkusit znovu");\n    expect(text).toContain("!loading && !error");\n  });\n});'''
          replacement = '''  it("heatmap vedení neprezentuje API chybu jako legitimně prázdná data", () => {\n    const text = source("src/app/(school)/app/analytics/class-heatmap/page.tsx");\n\n    expect(text).toContain("Přehled výsledků tříd se nepodařilo načíst.");\n    expect(text).toContain("Zkusit znovu");\n    expect(text).toContain("!loading && !error");\n  });\n\n  it("globální hlavička nezobrazuje mrtvou notifikační akci", () => {\n    const text = source("src/components/layout/app-header.tsx");\n\n    expect(text).not.toContain("Notifikace zatím nejsou aktivní");\n    expect(text).not.toContain("<Bell");\n    expect(text).toContain("Vytvořit test");\n  });\n});'''
          if policy_text.count(marker) != 1:
              raise SystemExit(f"policy insertion marker count: {policy_text.count(marker)}")
          policy.write_text(policy_text.replace(marker, replacement, 1))
          PY

      - name: Install backend dependencies
        working-directory: server
        run: npm ci --include=dev

      - name: Prisma generate
        working-directory: server
        run: npm run prisma:generate

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci --include=dev

      - name: Lint frontend
        working-directory: client
        run: npm run lint

      - name: Typecheck frontend
        working-directory: client
        run: npm run typecheck

      - name: Run frontend unit tests
        working-directory: client
        run: npm run test:unit

      - name: Build frontend
        working-directory: client
        env:
          NODE_ENV: production
          API_PROXY_TARGET: http://127.0.0.1:4200
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Migrate test database
        working-directory: server
        run: DATABASE_URL="$DATABASE_URL_TEST" npx prisma migrate deploy

      - name: Run school readiness browser scenario
        working-directory: client
        run: npx playwright test tests/scenarios/school-readiness.scenario.ts --config playwright.scenarios.config.ts --project=desktop

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: school-readiness-browser-failure
          path: |
            client/playwright-report-scenarios
            client/test-results
          retention-days: 7

      - name: Commit verified browser contract and remove helper
        shell: bash
        run: |
          rm .github/workflows/ux-school-browser-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/tests/scenarios/school-readiness.scenario.ts \
                  client/src/tests/ux-school-surface-policy.spec.ts \
                  .github/workflows/ux-school-browser-gate.yml
          git commit -m "test(ux): verify school actions in real browser"
          git push origin HEAD:fix/school-readiness-rbac-contracts
