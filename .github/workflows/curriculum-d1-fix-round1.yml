name: Curriculum D1 Fix Round 1

on:
  push:
    branches:
      - agent/curriculum-foundation-d1
    paths:
      - scripts/internal/fix-curriculum-d1-round1.mjs
      - .github/workflows/curriculum-d1-fix-round1.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/curriculum-foundation-d1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Apply exact fixes
        run: node scripts/internal/fix-curriculum-d1-round1.mjs

      - name: Validate patch shape
        run: |
          git diff --check
          test ! -f scripts/internal/fix-curriculum-d1-round1.mjs
          test ! -f .github/workflows/curriculum-d1-fix-round1.yml
          ! grep -Eq '\bUUID\b' server/prisma/migrations/20260809005500_curriculum_foundation_d1/migration.sql
          grep -q "status!: SchoolOutcomeMappingStatus" server/src/curriculum/dto/curriculum.dto.ts
          grep -q "sourceFileId: dto.sourceFileId?.trim() ?? null" server/src/curriculum/curriculum.service.ts

      - name: Commit production-only result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(curriculum): align D1 migration and strict typing"
          git push origin HEAD:agent/curriculum-foundation-d1
