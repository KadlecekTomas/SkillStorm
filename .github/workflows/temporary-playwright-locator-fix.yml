name: Temporary Playwright locator fix

on:
  push:
    branches:
      - fix/school-readiness-rbac-contracts
    paths:
      - '.github/workflows/temporary-playwright-locator-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/school-readiness-rbac-contracts
          fetch-depth: 0
      - name: Make competency assertion exact
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('client/tests/scenarios/progress.scenario.ts'); s=p.read_text(); old=\"await expect(page.getByText(competencyName)).toBeVisible();\"; new=\"await expect(page.getByText(competencyName, { exact: true })).toBeVisible();\"; assert old in s or new in s, 'locator marker missing'; p.write_text(s.replace(old,new,1))"
      - name: Commit test correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/tests/scenarios/progress.scenario.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test(progress): use exact competency locator"
          git pull --rebase origin fix/school-readiness-rbac-contracts
          git push origin HEAD:fix/school-readiness-rbac-contracts
