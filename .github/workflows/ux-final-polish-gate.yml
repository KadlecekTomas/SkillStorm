name: Temporary final school UX polish gate

on:
  push:
    branches: [fix/school-readiness-rbac-contracts]
    paths: [.github/workflows/ux-final-polish-gate.yml]

permissions:
  contents: write

concurrency:
  group: skillstorm-final-school-ux-polish
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/skillstorm_test
  JWT_SECRET: ciSyntheticAccessSecret1234567890abcdef
  JWT_ACCESS_SECRET: ciSyntheticAccessSecret1234567890abcdef
  JWT_REFRESH_SECRET: ciSyntheticRefreshSecret1234567890abcdef
  COOKIE_SECRET: ciSyntheticCookieSecret1234567890abcdef
  METRICS_INGEST_KEY: ciSyntheticMetricsKey1234567890abcdef
  CORS_ORIGINS: http://127.0.0.1:3001,http://localhost:3001
  PUBLIC_APP_URL: http://127.0.0.1:3001
  API_URL: http://127.0.0.1:4200
  API_PROXY_TARGET: http://127.0.0.1:4200
  BASE_URL: http://127.0.0.1:3001
  DISABLE_THROTTLE: "0"
  TRUST_PROXY: "1"
  DISABLE_CSRF: "1"
  CI: "true"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skillstorm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d skillstorm_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/school-readiness-rbac-contracts
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Apply final shared UX copy and add regression policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("client/src/components/onboarding/NoOrganizationScreen.tsx")
          text = path.read_text()
          replacements = {
              "Založ novou školu a nastav její název. Získáš roli OWNER a můžeš\n                spravovat školu.":
              "Založ novou školu a nastav její název. Budeš jejím vlastníkem a můžeš\n                spravovat její nastavení.",
              "Zadej kód od ředitele a vyber svou roli. Připojení zvládneš bez\n                manuálních kroků.":
              "Zadej kód od ředitele nebo učitele. Role se nastaví automaticky\n                podle pozvánky.",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"NoOrganizationScreen match count {text.count(old)} for {old[:80]!r}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          cat > client/src/tests/ux-shared-chrome-policy.spec.ts <<'EOF'
          import { readFileSync } from "node:fs";
          import { join } from "node:path";
          import { describe, expect, it } from "vitest";

          const CLIENT_ROOT = process.cwd().endsWith("/client")
            ? process.cwd()
            : join(process.cwd(), "client");

          function source(relativePath: string): string {
            return readFileSync(join(CLIENT_ROOT, relativePath), "utf8");
          }

          describe("shared school chrome UX policy", () => {
            it("přepínač školy zobrazuje lidské role a české aria popisky", () => {
              const text = source("src/components/layout/dashboard-header.tsx");
              expect(text).toContain('TEACHER: "Učitel"');
              expect(text).toContain('PARENT: "Rodič"');
              expect(text).toContain('aria-label="Aktivní škola"');
              expect(text).not.toContain("membership.role.toLowerCase()");
            });

            it("support dialog nepoužívá technický jazyk ani neplatné disabled link tlačítko", () => {
              const text = source("src/components/support/report-issue-button.tsx");
              expect(text).toContain("activeRole");
              expect(text).toContain('{ value: "STUDENT", label: "Žák" }');
              expect(text).toContain("Hlášení odešleme podpoře SkillStorm");
              expect(text).not.toContain("Support ticket");
              expect(text).not.toContain("superadminovi");
              expect(text).not.toMatch(/asChild\s+disabled/);
            });

            it("onboarding guardy respektují aktivně zvolenou roli", () => {
              const routeGuard = source("src/components/onboarding/OnboardingRouteGuard.tsx");
              const yearGate = source("src/components/onboarding/AcademicYearGate.tsx");
              for (const text of [routeGuard, yearGate]) {
                expect(text).toContain("activeRole");
                expect(text).toContain("effectiveRole");
              }
            });

            it("onboarding bez školy nevypisuje interní OWNER ani neslibuje ruční volbu role", () => {
              const text = source("src/components/onboarding/NoOrganizationScreen.tsx");
              expect(text).not.toContain("roli OWNER");
              expect(text).not.toContain("vyber svou roli");
              expect(text).toContain("Role se nastaví automaticky");
            });
          });
          EOF

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci --include=dev

      - name: Lint frontend
        working-directory: client
        run: npm run lint

      - name: Typecheck frontend
        working-directory: client
        run: npm run typecheck

      - name: Run frontend unit tests
        working-directory: client
        run: npm run test:unit

      - name: Build frontend
        working-directory: client
        env:
          NODE_ENV: production
          API_PROXY_TARGET: http://127.0.0.1:4200
        run: npm run build

      - name: Install backend dependencies
        working-directory: server
        run: npm ci --include=dev

      - name: Prisma generate
        working-directory: server
        run: npm run prisma:generate

      - name: Install Playwright Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Migrate test database
        working-directory: server
        run: DATABASE_URL="$DATABASE_URL_TEST" npx prisma migrate deploy

      - name: Run final school readiness browser scenario
        working-directory: client
        run: npx playwright test tests/scenarios/school-readiness.scenario.ts --config playwright.scenarios.config.ts --project=desktop

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: final-school-ux-browser-failure
          path: |
            client/playwright-report-scenarios
            client/test-results
          retention-days: 7

      - name: Commit verified polish and remove helper
        shell: bash
        run: |
          rm .github/workflows/ux-final-polish-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/onboarding/NoOrganizationScreen.tsx \
                  client/src/tests/ux-shared-chrome-policy.spec.ts \
                  .github/workflows/ux-final-polish-gate.yml
          git commit -m "fix(ux): finish shared school chrome polish"
          git push origin HEAD:fix/school-readiness-rbac-contracts
