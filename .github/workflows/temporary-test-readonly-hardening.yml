name: Temporary school-flow resilience hardening

on:
  push:
    branches:
      - fix/school-readiness-rbac-contracts
    paths:
      - '.github/workflows/temporary-test-readonly-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skillstorm_test
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skillstorm_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/skillstorm_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/school-readiness-rbac-contracts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch security and finite parent error states
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          controller = Path('server/src/tests/tests.controller.ts')
          text = controller.read_text()
          def swap(old, new, label):
              global text
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'marker not found: {label}')
          swap('  ForbiddenException,\n  UseGuards,', '  ForbiddenException,\n  NotFoundException,\n  UseGuards,', 'not found import')
          swap("import { OrganizationRole, PermissionKey } from '@prisma/client';", "import { OrganizationRole, PermissionKey, PublishStatus } from '@prisma/client';", 'publish status import')
          swap("  viewOne(\n    @Param('id', new ParseUUIDPipe()) id: string,\n    @Req() req: RequestWithUser,\n  ) {\n    return ok(this.service.findOne(id, req.user));\n  }", "  async viewOne(\n    @Param('id', new ParseUUIDPipe()) id: string,\n    @Req() req: RequestWithUser,\n  ) {\n    const detail = await this.service.findOne(id, req.user);\n    const teacherDetail = detail as { editMode?: unknown; status?: unknown } | null;\n    if (\n      req.user.organizationRole === OrganizationRole.TEACHER &&\n      teacherDetail?.editMode === 'NONE' &&\n      teacherDetail.status !== PublishStatus.PUBLISHED\n    ) {\n      throw new NotFoundException('Test nenalezen');\n    }\n    return ok(detail);\n  }", 'read-only route')
          controller.write_text(text)

          spec = Path('server/src/tests/tests.controller.spec.ts')
          s = spec.read_text()
          if "import { NotFoundException } from '@nestjs/common';" not in s:
              s = s.replace("import type { TestingModule } from '@nestjs/testing';\n", "import { NotFoundException } from '@nestjs/common';\nimport { OrganizationRole, PublishStatus } from '@prisma/client';\nimport type { TestingModule } from '@nestjs/testing';\n", 1)
          if '  let service: TestsService;\n' not in s:
              s = s.replace('  let controller: TestsController;\n', '  let controller: TestsController;\n  let service: TestsService;\n', 1)
          if '    service = module.get<TestsService>(TestsService);\n' not in s:
              s = s.replace('    controller = module.get<TestsController>(TestsController);\n', '    controller = module.get<TestsController>(TestsController);\n    service = module.get<TestsService>(TestsService);\n', 1)
          anchor = "  it('should be defined', () => {\n    expect(controller).toBeDefined();\n  });\n"
          tests = anchor + "\n  it('hides an unpublished colleague test from the teacher read-only route', async () => {\n    jest.spyOn(service, 'findOne').mockResolvedValue({ id: '11111111-1111-4111-8111-111111111111', status: PublishStatus.DRAFT, editMode: 'NONE' });\n    const req = { user: { organizationRole: OrganizationRole.TEACHER } } as Parameters<TestsController['viewOne']>[1];\n    await expect(controller.viewOne('11111111-1111-4111-8111-111111111111', req)).rejects.toBeInstanceOf(NotFoundException);\n  });\n\n  it('allows a published colleague test through the teacher read-only route', async () => {\n    jest.spyOn(service, 'findOne').mockResolvedValue({ id: '22222222-2222-4222-8222-222222222222', status: PublishStatus.PUBLISHED, editMode: 'NONE' });\n    const req = { user: { organizationRole: OrganizationRole.TEACHER } } as Parameters<TestsController['viewOne']>[1];\n    await expect(controller.viewOne('22222222-2222-4222-8222-222222222222', req)).resolves.toBeDefined();\n  });\n"
          if "hides an unpublished colleague test" not in s:
              if anchor not in s:
                  raise SystemExit('controller spec anchor not found')
              s = s.replace(anchor, tests, 1)
          spec.write_text(s)

          family = Path('client/src/app/(school)/app/family/page.tsx')
          f = family.read_text()
          if 'AlertTriangle' not in f.split('\n', 5)[2]:
              f = f.replace('import { CalendarClock, Sparkles } from "lucide-react";', 'import { AlertTriangle, CalendarClock, RefreshCw, Sparkles } from "lucide-react";', 1)
          f = f.replace('  const [busy, setBusy] = useState(false);\n\n  const answer = async (confirmed: boolean) => {\n    setBusy(true);\n    try {\n      await resolveGuardianRelation(child.relationId, confirmed);\n      onResolved(confirmed);\n    } finally {\n      setBusy(false);\n    }\n  };', '  const [busy, setBusy] = useState(false);\n  const [error, setError] = useState<string | null>(null);\n\n  const answer = async (confirmed: boolean) => {\n    setBusy(true);\n    setError(null);\n    try {\n      await resolveGuardianRelation(child.relationId, confirmed);\n      onResolved(confirmed);\n    } catch {\n      setError("Potvrzení se nepodařilo uložit. Zkontrolujte připojení a zkuste to znovu.");\n    } finally {\n      setBusy(false);\n    }\n  };', 1)
          marker = '        <div className="space-y-3">\n          <Button\n            size="lg"'
          replacement = '        {error && (\n          <p role="alert" className="rounded-xl border border-danger/30 bg-danger-soft p-3 text-sm font-semibold text-danger">\n            {error}\n          </p>\n        )}\n        <div className="space-y-3">\n          <Button\n            size="lg"'
          if marker in f:
              f = f.replace(marker, replacement, 1)
          elif 'Potvrzení se nepodařilo uložit' not in f:
              raise SystemExit('guardian confirmation error marker not found')

          f = f.replace('  const { data, isLoading } = useChildOverview(child.studentId);', '  const { data, error, isLoading, refetch } = useChildOverview(child.studentId);', 1)
          old = '  if (isLoading || !data) {\n    return (\n      <div className="flex justify-center py-16">\n        <LoadingSpinner />\n      </div>\n    );\n  }\n\n  const firstName'
          new = '  if (isLoading) {\n    return (\n      <div className="flex justify-center py-16">\n        <LoadingSpinner />\n      </div>\n    );\n  }\n  if (error || !data) {\n    return (\n      <Card>\n        <CardContent className="space-y-4 p-6 text-center">\n          <AlertTriangle className="mx-auto h-9 w-9 text-warning-strong" />\n          <h2 className="text-lg font-extrabold text-ink">Údaje dítěte se nepodařilo načíst</h2>\n          <p className="text-sm text-ink-muted">Zkontrolujte připojení a zkuste načtení znovu.</p>\n          <Button className="min-h-[48px] w-full sm:w-auto" onClick={() => void refetch()}>\n            <RefreshCw className="mr-2 h-4 w-4" /> Zkusit znovu\n          </Button>\n        </CardContent>\n      </Card>\n    );\n  }\n\n  const firstName'
          if old in f:
              f = f.replace(old, new, 1)
          elif 'Údaje dítěte se nepodařilo načíst' not in f:
              raise SystemExit('child overview error marker not found')

          f = f.replace('  const { data, isLoading, refetch } = useGuardianChildren(isParent);', '  const { data, error, isLoading, refetch } = useGuardianChildren(isParent);', 1)
          old = '  if (!isParent) return null;\n  if (isLoading || !data) {\n    return (\n      <div className="flex justify-center py-24">\n        <LoadingSpinner />\n      </div>\n    );\n  }\n\n  // Poděkování'
          new = '  if (!isParent) return null;\n  if (isLoading) {\n    return (\n      <div className="flex justify-center py-24">\n        <LoadingSpinner />\n      </div>\n    );\n  }\n  if (error || !data) {\n    return (\n      <Card className="mx-auto mt-8 max-w-md">\n        <CardContent className="space-y-4 p-6 text-center sm:p-8">\n          <AlertTriangle className="mx-auto h-10 w-10 text-warning-strong" />\n          <h1 className="text-xl font-extrabold text-ink">Rodinný přehled se nepodařilo načíst</h1>\n          <p className="text-[15px] leading-relaxed text-ink-muted">Zkontrolujte připojení k internetu a zkuste to prosím znovu.</p>\n          <Button size="lg" className="min-h-[52px] w-full" onClick={() => void refetch()}>\n            <RefreshCw className="mr-2 h-5 w-5" /> Zkusit znovu\n          </Button>\n        </CardContent>\n      </Card>\n    );\n  }\n\n  // Poděkování'
          if old in f:
              f = f.replace(old, new, 1)
          elif 'Rodinný přehled se nepodařilo načíst' not in f:
              raise SystemExit('family error marker not found')
          family.write_text(f)

          contract = Path('client/src/tests/family-resilience-contract.spec.ts')
          contract.write_text('''import { readFileSync } from "node:fs";\nimport { join } from "node:path";\nimport { describe, expect, it } from "vitest";\n\nconst ROOT = process.cwd().endsWith("/client") ? process.cwd() : join(process.cwd(), "client");\nconst source = readFileSync(join(ROOT, "src/app/(school)/app/family/page.tsx"), "utf8");\n\ndescribe("family finite error-state contracts", () => {\n  it("never turns guardian list or child detail failures into an infinite spinner", () => {\n    expect(source).toContain("Rodinný přehled se nepodařilo načíst");\n    expect(source).toContain("Údaje dítěte se nepodařilo načíst");\n    expect(source.match(/Zkusit znovu/g)?.length ?? 0).toBeGreaterThanOrEqual(2);\n  });\n\n  it("shows guardian relation mutation failures instead of swallowing them", () => {\n    expect(source).toContain("Potvrzení se nepodařilo uložit");\n    expect(source).toContain('role="alert"');\n  });\n});\n''')
          PY

      - name: Verify backend read-only contract
        working-directory: server
        run: |
          npm ci
          npm run prisma:generate
          npx prisma migrate deploy
          npx jest src/tests/tests.controller.spec.ts --runInBand
          npm run typecheck

      - name: Verify parent resilience contracts
        working-directory: client
        run: |
          npm ci
          npx vitest run src/tests/family-resilience-contract.spec.ts src/tests/progress-responsive-contract.spec.ts src/tests/ux-action-integrity.spec.ts
          npm run typecheck

      - name: Commit verified hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/tests/tests.controller.ts server/src/tests/tests.controller.spec.ts client/src/app/'(school)'/app/family/page.tsx client/src/tests/family-resilience-contract.spec.ts
          if git diff --cached --quiet; then
            echo "Hardening already applied"
            exit 0
          fi
          git commit -m "fix: close school-flow error and visibility gaps"
          git pull --rebase origin fix/school-readiness-rbac-contracts
          git push origin HEAD:fix/school-readiness-rbac-contracts
