name: Temporary security lock refresh

on:
  push:
    branches:
      - chore/security-next-react-upgrade

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Refresh lockfile from package.json
        working-directory: client
        run: npm install --package-lock-only --ignore-scripts

      - name: Clean install from refreshed lockfile
        working-directory: client
        run: npm ci

      - name: Typecheck
        working-directory: client
        run: npm run typecheck

      - name: Unit and component tests
        working-directory: client
        run: npm run test:unit

      - name: Production build
        working-directory: client
        run: npm run build

      - name: Commit verified lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/package-lock.json
          if git diff --cached --quiet; then
            echo "Expected package-lock.json to change, but it did not."
            exit 1
          fi
          git commit -m "chore(security): refresh client dependency lock"
          git push origin HEAD:chore/security-next-react-upgrade
