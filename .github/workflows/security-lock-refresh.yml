name: Temporary dependency security audit

on:
  push:
    branches:
      - chore/security-next-react-upgrade

permissions:
  contents: read

jobs:
  audit-production-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Frontend production audit details
        working-directory: client
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/client-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/client-audit.json', 'utf8'));
          console.log('CLIENT_PROD_AUDIT_SUMMARY=' + JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, v] of Object.entries(report.vulnerabilities ?? {})) {
            console.log('CLIENT_PROD_VULN=' + JSON.stringify({
              name,
              severity: v.severity,
              isDirect: v.isDirect,
              range: v.range,
              nodes: v.nodes,
              fixAvailable: v.fixAvailable,
              via: (v.via ?? []).map((item) => typeof item === 'string' ? item : ({
                source: item.source,
                name: item.name,
                severity: item.severity,
                title: item.title,
                url: item.url,
                range: item.range,
              })),
            }));
          }
          NODE

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Backend production audit details
        working-directory: server
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/server-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/server-audit.json', 'utf8'));
          console.log('SERVER_PROD_AUDIT_SUMMARY=' + JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, v] of Object.entries(report.vulnerabilities ?? {})) {
            console.log('SERVER_PROD_VULN=' + JSON.stringify({
              name,
              severity: v.severity,
              isDirect: v.isDirect,
              range: v.range,
              nodes: v.nodes,
              fixAvailable: v.fixAvailable,
              via: (v.via ?? []).map((item) => typeof item === 'string' ? item : ({
                source: item.source,
                name: item.name,
                severity: item.severity,
                title: item.title,
                url: item.url,
                range: item.range,
              })),
            }));
          }
          NODE
