name: Lesson D2-B Schema Bootstrap

on:
  push:
    branches: [agent/lesson-experience-d2b]
    paths:
      - 'scripts/internal/apply-lesson-d2b-schema.mjs'
      - '.github/workflows/lesson-d2b-schema-bootstrap.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/lesson-experience-d2b
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply exact schema patch
        run: node scripts/internal/apply-lesson-d2b-schema.mjs
      - name: Validate production-only result
        run: |
          test ! -e scripts/internal/apply-lesson-d2b-schema.mjs
          test ! -e .github/workflows/lesson-d2b-schema-bootstrap.yml
          git diff --check
          cd server
          npm ci
          npm run prisma:generate
          npx prisma validate
      - name: Commit production-only result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(lesson): add D2-B Lesson Experience schema'
          git push origin HEAD:agent/lesson-experience-d2b
