name: Classroom D2-C Kernel Repair

on:
  push:
    branches:
      - agent/classroom-orchestration-d2c
    paths:
      - 'scripts/repair-classroom-kernel-types.mjs'
      - '.github/workflows/classroom-d2c-kernel-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skillstorm_test
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/classroom-orchestration-d2c
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - working-directory: server
        run: npm ci
      - working-directory: server
        run: npm run prisma:generate
      - run: node scripts/repair-classroom-kernel-types.mjs
      - working-directory: server
        run: npm run typecheck
      - working-directory: server
        run: npm test -- classroom-orchestration.constants.spec.ts --runInBand
      - name: Commit repair and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/classroom-orchestration/classroom-orchestration.service.ts
          git rm scripts/repair-classroom-kernel-types.mjs .github/workflows/classroom-d2c-kernel-repair.yml
          git commit -m "fix(classroom): normalize semantic JSON persistence"
          git push origin HEAD:agent/classroom-orchestration-d2c
