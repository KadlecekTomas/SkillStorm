name: Temporary progress autofix

on:
  push:
    branches:
      - fix/school-readiness-rbac-contracts
    paths:
      - '.github/workflows/temporary-progress-autofix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/skillstorm_schema_validation?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/school-readiness-rbac-contracts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Repair generated progress patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page_path = Path('client/src/app/(school)/app/progress/page.tsx')
          page = page_path.read_text()
          broken = 'const isBrowserOnline = (): boolean =>\n  typeof navigator === "undefined" ? true : isBrowserOnline();'
          fixed = 'const isBrowserOnline = (): boolean =>\n  typeof navigator === "undefined" ? true : navigator.onLine;'
          if broken not in page:
              raise SystemExit('expected broken online helper not found')
          page = page.replace(broken, fixed, 1)
          page_path.write_text(page)

          family_path = Path('client/src/app/(school)/app/family/page.tsx')
          family = family_path.read_text()
          family = family.replace(
              'import { CalendarClock, Mail, Sparkles } from "lucide-react";',
              'import { CalendarClock, Sparkles } from "lucide-react";',
              1,
          )
          family_path.write_text(family)
          PY

      - name: Validate Prisma schema remains healthy
        working-directory: server
        run: |
          npm ci
          npx prisma format --check
          npx prisma validate

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/app/'(school)'/app/progress/page.tsx client/src/app/'(school)'/app/family/page.tsx
          git commit -m "fix(progress): repair online detection and family imports"
          git pull --rebase origin fix/school-readiness-rbac-contracts
          git push origin HEAD:fix/school-readiness-rbac-contracts
