name: Temporary progress autofix

on:
  push:
    branches:
      - fix/school-readiness-rbac-contracts
    paths:
      - '.github/workflows/temporary-progress-autofix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/school-readiness-rbac-contracts
          fetch-depth: 0

      - name: Make deterministic scenario wipe progress-aware
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('server/prisma/seed/scenarios-e2e.seed.ts')
          text = path.read_text()
          marker = '  await prisma.enrollment.deleteMany({ where: { orgId: { in: orgIds } } });'
          patch = '''  await prisma.studentIntervention.deleteMany({\n    where: { organizationId: { in: orgIds } },\n  });\n  await prisma.attendanceRecord.deleteMany({\n    where: { organizationId: { in: orgIds } },\n  });\n  await prisma.studentProgressEntry.deleteMany({\n    where: { organizationId: { in: orgIds } },\n  });\n  await prisma.competency.deleteMany({\n    where: { organizationId: { in: orgIds } },\n  });\n'''
          if patch.strip() not in text:
              if marker not in text:
                  raise SystemExit('scenario wipe marker not found')
              text = text.replace(marker, patch + marker, 1)
          path.write_text(text)
          PY

      - name: Commit seed hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/prisma/seed/scenarios-e2e.seed.ts
          if git diff --cached --quiet; then
            echo "Scenario wipe already patched"
            exit 0
          fi
          git commit -m "test(progress): clean progress rows during scenario reseed"
          git pull --rebase origin fix/school-readiness-rbac-contracts
          git push origin HEAD:fix/school-readiness-rbac-contracts
