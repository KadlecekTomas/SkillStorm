name: Temporary progress autofix

on:
  push:
    branches:
      - fix/school-readiness-rbac-contracts
    paths:
      - '.github/workflows/temporary-progress-autofix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/skillstorm_schema_validation?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/school-readiness-rbac-contracts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply deterministic progress patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page_path = Path('client/src/app/(school)/app/progress/page.tsx')
          page = page_path.read_text()
          if 'const isBrowserOnline' not in page:
              marker = 'function MetricCard({'
              helper = 'const isBrowserOnline = (): boolean =>\n  typeof navigator === "undefined" ? true : navigator.onLine;\n\n'
              if marker not in page:
                  raise SystemExit('progress page helper marker not found')
              page = page.replace(marker, helper + marker, 1)
          page = page.replace('navigator.onLine', 'isBrowserOnline()')
          page = page.replace(
              'export default function ProgressPage() {',
              'export default function ProgressPage(): React.JSX.Element | null {',
              1,
          )
          page_path.write_text(page)

          family_path = Path('client/src/app/(school)/app/family/page.tsx')
          family = family_path.read_text()
          guardian_import = 'import { GuardianSchoolProgress } from "@/components/guardian/guardian-school-progress";\n'
          if guardian_import not in family:
              import_marker = 'import { cn } from "@/utils/cn";\n'
              if import_marker not in family:
                  raise SystemExit('family import marker not found')
              family = family.replace(import_marker, import_marker + guardian_import, 1)
          if '<GuardianSchoolProgress data={data} />' not in family:
              start_marker = '      {/* Zprávy */}\n'
              end_marker = '    </div>\n  );\n}\n\nexport default function FamilyPage'
              if start_marker not in family or end_marker not in family:
                  raise SystemExit('family message block marker not found')
              prefix, rest = family.split(start_marker, 1)
              _, suffix = rest.split(end_marker, 1)
              family = (
                  prefix
                  + '      <GuardianSchoolProgress data={data} />\n'
                  + end_marker
                  + suffix
              )
          family_path.write_text(family)

          schema_path = Path('server/prisma/schema.prisma')
          schema = schema_path.read_text()
          if '  PROGRESS\n}' not in schema:
              marker = '  CATALOG_TOPIC\n}'
              if marker not in schema:
                  raise SystemExit('AuditEntityType marker not found')
              schema = schema.replace(marker, '  CATALOG_TOPIC\n  PROGRESS\n}', 1)
          if 'model StudentProgressEntry {' not in schema:
              fragment = Path('server/prisma/progress.prisma.fragment').read_text()
              schema = schema.rstrip() + '\n\n' + fragment.strip() + '\n'
          schema_path.write_text(schema)
          PY

      - name: Format and validate Prisma schema
        working-directory: server
        run: |
          npm ci
          npx prisma format
          npx prisma validate

      - name: Commit deterministic fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/prisma/schema.prisma \
            client/src/app/'(school)'/app/progress/page.tsx \
            client/src/app/'(school)'/app/family/page.tsx
          if git diff --cached --quiet; then
            echo "No patch required"
            exit 0
          fi
          git commit -m "fix(progress): align schema, SSR and guardian view"
          git pull --rebase origin fix/school-readiness-rbac-contracts
          git push origin HEAD:fix/school-readiness-rbac-contracts
