name: Temporary progress autofix

on:
  push:
    branches:
      - fix/school-readiness-rbac-contracts
    paths:
      - '.github/workflows/temporary-progress-autofix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/school-readiness-rbac-contracts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply deterministic progress patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page_path = Path('client/src/app/(school)/app/progress/page.tsx')
          page = page_path.read_text()
          if 'const isBrowserOnline' not in page:
              marker = 'function MetricCard({'
              helper = 'const isBrowserOnline = (): boolean =>\n  typeof navigator === "undefined" ? true : navigator.onLine;\n\n'
              if marker not in page:
                  raise SystemExit('progress page helper marker not found')
              page = page.replace(marker, helper + marker, 1)
          page = page.replace('navigator.onLine', 'isBrowserOnline()')
          page = page.replace(
              'export default function ProgressPage() {',
              'export default function ProgressPage(): React.JSX.Element | null {',
              1,
          )
          page_path.write_text(page)

          schema_path = Path('server/prisma/schema.prisma')
          schema = schema_path.read_text()
          if '  PROGRESS\n}' not in schema:
              marker = '  CATALOG_TOPIC\n}'
              if marker not in schema:
                  raise SystemExit('AuditEntityType marker not found')
              schema = schema.replace(marker, '  CATALOG_TOPIC\n  PROGRESS\n}', 1)
          if 'model StudentProgressEntry {' not in schema:
              fragment = Path('server/prisma/progress.prisma.fragment').read_text()
              schema = schema.rstrip() + '\n\n' + fragment.strip() + '\n'
          schema_path.write_text(schema)
          PY

      - name: Format and validate Prisma schema
        working-directory: server
        run: |
          npm ci
          npx prisma format
          npx prisma validate

      - name: Commit deterministic fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/prisma/schema.prisma client/src/app/'(school)'/app/progress/page.tsx
          if git diff --cached --quiet; then
            echo "No patch required"
            exit 0
          fi
          git commit -m "fix(progress): align Prisma schema and SSR-safe offline state"
          git push origin HEAD:fix/school-readiness-rbac-contracts
