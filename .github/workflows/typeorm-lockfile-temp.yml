name: Temporary TypeORM lockfile regeneration

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  regenerate:
    if: github.head_ref == 'chore/remove-dead-typeorm'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Use Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Regenerate package manifest and lockfile with npm
        shell: bash
        run: |
          set -euo pipefail
          cd server
          npm audit --omit=dev --json > /tmp/audit-before.json || true
          npm uninstall typeorm @nestjs/typeorm --package-lock-only --ignore-scripts
          npm install --package-lock-only --ignore-scripts
          npm audit --omit=dev --json > /tmp/audit-after.json || true
          node <<'NODE'
          const fs = require('fs');
          const before = JSON.parse(fs.readFileSync('/tmp/audit-before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('/tmp/audit-after.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const vulns = x => x?.metadata?.vulnerabilities ?? {};
          console.log('runtime audit before:', JSON.stringify(vulns(before)));
          console.log('runtime audit after :', JSON.stringify(vulns(after)));
          const deps = pkg.dependencies ?? {};
          if ('typeorm' in deps || '@nestjs/typeorm' in deps) {
            throw new Error('TypeORM still exists in package.json dependencies');
          }
          const rootDeps = lock.packages?.['']?.dependencies ?? {};
          if ('typeorm' in rootDeps || '@nestjs/typeorm' in rootDeps) {
            throw new Error('TypeORM still exists in package-lock root dependencies');
          }
          const typeormEntries = Object.keys(lock.packages ?? {}).filter(k => /typeorm/i.test(k));
          console.log('remaining TypeORM lock entries:', typeormEntries);
          if (typeormEntries.length !== 0) {
            throw new Error(`TypeORM package entries remain: ${typeormEntries.join(', ')}`);
          }
          NODE
          npm ci --ignore-scripts
          npm run prisma:generate
          npm run typecheck
          git diff --check

      - name: Commit npm-generated dependency cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/typeorm-lockfile-temp.yml
          git add server/package.json server/package-lock.json .github/workflows/typeorm-lockfile-temp.yml
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove dead TypeORM dependencies"
          git push origin HEAD:chore/remove-dead-typeorm
