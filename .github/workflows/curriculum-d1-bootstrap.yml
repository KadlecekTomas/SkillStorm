name: Curriculum D1 Bootstrap

on:
  push:
    branches:
      - agent/curriculum-foundation-d1
    paths:
      - scripts/internal/apply-curriculum-d1.mjs
      - .github/workflows/curriculum-d1-bootstrap.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/curriculum-foundation-d1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Apply exact schema/module/migration patch
        run: node scripts/internal/apply-curriculum-d1.mjs

      - name: Validate patch shape
        run: |
          git diff --check
          test -f server/prisma/migrations/20260809005500_curriculum_foundation_d1/migration.sql
          test ! -f scripts/internal/apply-curriculum-d1.mjs
          test ! -f .github/workflows/curriculum-d1-bootstrap.yml
          grep -q 'model CurriculumFramework {' server/prisma/schema.prisma
          grep -q "CurriculumModule" server/src/app.module.ts

      - name: Commit production-only result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(curriculum): add D1 schema and DB invariants"
          git push origin HEAD:agent/curriculum-foundation-d1
