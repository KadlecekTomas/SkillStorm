name: School Product Certification

on:
  pull_request:
    branches: [main, feature/school-product-certification]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: school-product-certification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.19.0"
  CERT_POSTGRES_PORT: "55432"
  CERT_HTTPS_PORT: "3443"
  BASE_URL: https://localhost:3443
  SCENARIO_REUSE_DB: "1"
  SCENARIO_PRESEEDED: "1"

  PROD_POSTGRES_USER: skillstorm_cert
  PROD_POSTGRES_PASSWORD: ciSyntheticCertificationPostgresPassword123456
  PROD_POSTGRES_DB: skillstorm_test
  PROD_DATABASE_URL: postgresql://skillstorm_cert:ciSyntheticCertificationPostgresPassword123456@postgres:5432/skillstorm_test?schema=public
  DATABASE_URL_TEST: postgresql://skillstorm_cert:ciSyntheticCertificationPostgresPassword123456@127.0.0.1:55432/skillstorm_test?schema=public

  PROD_JWT_ACCESS_SECRET: C1A9f4E7b2D8k6M3q5R0u7W4x9Z2n8P6s3V5
  PROD_JWT_REFRESH_SECRET: H8K2m5Q9v3X7c1B6n4R0t8Y5p2W9d7F3a6J1
  PROD_COOKIE_SECRET: N7P4x9C2k6V1m8R5q3Y0b7D4s9H2w6T8f5L3
  PROD_METRICS_INGEST_KEY: Z6R2c8M5v1K9p4X7n3B0q6W2y8H5d1F9a4T7
  PROD_RUN_MIGRATIONS: "1"
  PROD_RUN_SEED: "0"
  PROD_PUBLIC_APP_URL: https://localhost:3443
  PROD_API_URL: https://localhost:3443
  PROD_API_PROXY_TARGET: http://backend:4200
  PROD_CORS_ORIGINS: https://localhost:3443
  PROD_TRUST_PROXY: "1"
  PROD_ALLOW_CROSS_SITE_COOKIES: "0"
  PROD_ALLOW_PUBLIC_ORG_CREATION: "false"
  PROD_FRONTEND_PORT: "3000"
  PROD_ENABLE_RBAC_TELEMETRY_CLIENT: "0"
  PROD_BETA_MODE: ""
  PROD_SUPERADMIN_EMAIL: ""
  PROD_SUPERADMIN_PASSWORD: ""

jobs:
  school-product-certification:
    name: School Product Certification (Node 24 + HTTPS + recovery)
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4

      - name: Setup supported Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Prove host certification runtime is Node 24
        run: node -e "if (process.versions.node.split('.')[0] !== '24') { throw new Error('Expected Node 24, got ' + process.version) } console.log('host_node=' + process.version)"

      - name: Install backend certification tooling
        run: npm ci --include=dev
        working-directory: server

      - name: Generate Prisma client for deterministic school seed
        run: npm run prisma:generate
        working-directory: server
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}

      - name: Install frontend certification tooling
        run: npm ci --include=dev
        working-directory: client

      - name: Install real Chromium
        run: npx playwright install --with-deps chromium
        working-directory: client

      - name: Enforce no internal API mocks in certification journeys
        run: node scripts/assert-product-certification-no-api-mocks.mjs
        working-directory: client

      - name: Validate production-shaped Docker topology
        run: docker compose -f docker-compose.prod.yml -f docker-compose.certification.yml config --quiet

      - name: Boot disposable database infrastructure first
        run: docker compose -f docker-compose.prod.yml -f docker-compose.certification.yml up -d postgres redis --wait --wait-timeout 120

      - name: Prove host-only PostgreSQL bridge is reachable
        shell: bash
        run: |
          set -euo pipefail
          mapped="$(docker compose -f docker-compose.prod.yml -f docker-compose.certification.yml port postgres 5432)"
          echo "postgres_host_mapping=$mapped"
          test "$mapped" = "127.0.0.1:${CERT_POSTGRES_PORT}"
          ./client/node_modules/.bin/wait-on --timeout 30000 "tcp:127.0.0.1:${CERT_POSTGRES_PORT}"

      - name: Preseed deterministic school and SUPERADMIN
        shell: bash
        run: |
          set -euo pipefail
          SCENARIO_PRESEEDED=0 SCENARIO_REUSE_DB=0 \
            ./server/node_modules/.bin/ts-node \
            --transpile-only \
            --compiler-options '{"module":"CommonJS","moduleResolution":"node"}' \
            -e "require('./client/tests/scenarios/global-setup.ts').default().catch((error) => { console.error(error); process.exit(1); })"

      - name: Build and boot exact production runners plus TLS edge
        run: docker compose -f docker-compose.prod.yml -f docker-compose.certification.yml up -d --build backend frontend certification_tls --wait --wait-timeout 240

      - name: Prove both production runners are Node 24
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.prod.yml -f docker-compose.certification.yml exec -T backend node -e "if (process.versions.node.split('.')[0] !== '24') throw new Error('backend=' + process.version); console.log('backend_node=' + process.version)"
          docker compose -f docker-compose.prod.yml -f docker-compose.certification.yml exec -T frontend node -e "if (process.versions.node.split('.')[0] !== '24') throw new Error('frontend=' + process.version); console.log('frontend_node=' + process.version)"

      - name: Prove HTTPS production surface is reachable
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail --insecure --max-time 5 "$BASE_URL" >/dev/null; then
              echo "https_surface_ready=true"
              exit 0
            fi
            sleep 2
          done
          echo "HTTPS production surface did not become reachable" >&2
          exit 1

      - name: Run school-critical HTTPS black-box journeys
        run: npx playwright test --config playwright.product-certification.config.ts
        working-directory: client

      - name: Setup pinned k6
        uses: grafana/setup-k6-action@v1.2.1
        with:
          k6-version: "2.1.0"

      - name: Certify 30 concurrent students in 8.A over HTTPS
        run: k6 run tests/load/school-30-students.k6.js
        working-directory: client
        env:
          BASE_URL: ${{ env.BASE_URL }}

      - name: Certify destructive PostgreSQL backup and HTTPS restore
        run: bash scripts/certify-backup-restore.sh

      - name: Capture production stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml -f docker-compose.certification.yml logs --no-color > product-certification-compose.log

      - name: Upload human-reviewable certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: school-product-certification-evidence
          path: |
            client/playwright-report-product-certification
            client/test-results/**/*.webm
            client/test-results/**/*.zip
            client/test-results/**/*.png
            client/test-results/k6-school-30-students-summary.json
            client/test-results/backup-restore-certification/report.txt
          if-no-files-found: warn
          retention-days: 21

      - name: Upload production stack failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: school-product-certification-stack-logs
          path: product-certification-compose.log
          if-no-files-found: error
          retention-days: 21

      - name: Destroy disposable certification environment
        if: always()
        run: docker compose -f docker-compose.prod.yml -f docker-compose.certification.yml down -v --remove-orphans
