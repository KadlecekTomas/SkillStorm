name: Temporary query and school throttling hardening

on:
  push:
    branches:
      - fix/school-readiness-rbac-contracts
    paths:
      - '.github/workflows/temporary-query-throttle-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skillstorm_test
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skillstorm_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/skillstorm_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/school-readiness-rbac-contracts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch query notifications and throttle tracker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          query = Path('client/src/lib/query-client.ts')
          q = query.read_text()

          old_entry = 'type QueryEntry<T = unknown> = {\n  data?: T;\n  error?: unknown;\n  updatedAt: number;\n  promise: Promise<T> | null;\n  listeners: Set<() => void>;\n};'
          new_entry = 'type QueryNotificationReason = "state" | "invalidate";\n\ntype QueryEntry<T = unknown> = {\n  data?: T;\n  error?: unknown;\n  updatedAt: number;\n  promise: Promise<T> | null;\n  listeners: Set<(reason: QueryNotificationReason) => void>;\n};'
          if old_entry in q:
              q = q.replace(old_entry, new_entry, 1)
          elif new_entry not in q:
              raise SystemExit('query entry marker not found')

          old_notify = 'function notify(queryKey: QueryKey) {\n  const entry = ensureEntry(queryKey);\n  entry.listeners.forEach((listener) => listener());\n}'
          new_notify = 'function notify(\n  queryKey: QueryKey,\n  reason: QueryNotificationReason = "state",\n) {\n  const entry = ensureEntry(queryKey);\n  entry.listeners.forEach((listener) => listener(reason));\n}'
          if old_notify in q:
              q = q.replace(old_notify, new_notify, 1)
          elif new_notify not in q:
              raise SystemExit('notify marker not found')

          old_invalidate = '      if (options?.notify !== false) {\n        notify(queryKey);\n      }'
          new_invalidate = '      if (options?.notify !== false) {\n        notify(queryKey, "invalidate");\n      }'
          if old_invalidate in q:
              q = q.replace(old_invalidate, new_invalidate, 1)
          elif new_invalidate not in q:
              raise SystemExit('invalidate notify marker not found')

          old_subscribe_sig = '  subscribe(queryKey: QueryKey, listener: () => void): () => void {'
          new_subscribe_sig = '  subscribe(\n    queryKey: QueryKey,\n    listener: (reason: QueryNotificationReason) => void,\n  ): () => void {'
          if old_subscribe_sig in q:
              q = q.replace(old_subscribe_sig, new_subscribe_sig, 1)
          elif new_subscribe_sig not in q:
              raise SystemExit('subscribe signature marker not found')

          old_subscriber = '    const unsubscribe = queryClient.subscribe(key, () => {\n      syncFromCache();\n      if (!queryClient.isFresh(key, staleTime)) {\n        void load(true);\n      }\n    });'
          new_subscriber = '    const unsubscribe = queryClient.subscribe(key, (reason) => {\n      syncFromCache();\n      // State notifications are emitted by the request already in flight\n      // (success/error) and by local cache writes. Re-fetching on those\n      // notifications would turn every failed query into a request storm.\n      if (reason === "invalidate" && !queryClient.isFresh(key, staleTime)) {\n        void load(true);\n      }\n    });'
          if old_subscriber in q:
              q = q.replace(old_subscriber, new_subscriber, 1)
          elif new_subscriber not in q:
              raise SystemExit('query subscriber marker not found')
          query.write_text(q)

          tracker = Path('server/src/common/throttling/request-tracker.ts')
          tracker.parent.mkdir(parents=True, exist_ok=True)
          tracker.write_text("import { createHash } from 'crypto';\nimport type { Request } from 'express';\n\nimport { ACCESS_TOKEN_COOKIE } from '@/auth/token-cookies';\n\ntype ThrottleRequest = Request & {\n  cookies?: Record<string, string | undefined>;\n};\n\nconst IP_SCOPED_AUTH_PATHS = new Set([\n  '/auth/login',\n  '/auth/register',\n  '/auth/sso/google',\n  '/auth/refresh',\n  '/auth/forgot-password',\n  '/auth/reset-password',\n]);\n\nfunction normalizedPath(req: ThrottleRequest): string {\n  const raw = req.originalUrl || req.url || '';\n  const pathname = raw.split('?')[0] ?? '';\n  return pathname.replace(/^\\/api(?=\\/)/, '');\n}\n\nfunction bearerToken(req: ThrottleRequest): string | null {\n  const authorization = req.headers?.authorization;\n  if (!authorization?.startsWith('Bearer ')) return null;\n  const token = authorization.slice('Bearer '.length).trim();\n  return token || null;\n}\n\n/**\n * School networks commonly put many teachers/tablets behind one public IP.\n * A pure IP tracker would therefore let one busy classroom throttle another.\n * Sensitive public auth routes remain IP-scoped, while normal authenticated\n * traffic is isolated per access-token session. The token is never stored in\n * the throttle key; only a one-way SHA-256 digest is used.\n */\nexport function resolveThrottleTracker(req: ThrottleRequest): string {\n  const ip = req.ip || 'unknown';\n  if (IP_SCOPED_AUTH_PATHS.has(normalizedPath(req))) {\n    return `ip:${ip}`;\n  }\n\n  const token = req.cookies?.[ACCESS_TOKEN_COOKIE] ?? bearerToken(req);\n  if (!token) {\n    return `ip:${ip}`;\n  }\n\n  const digest = createHash('sha256').update(token).digest('hex');\n  return `session:${digest}`;\n}\n")

          app = Path('server/src/app.module.ts')
          a = app.read_text()
          tracker_import = "import { resolveThrottleTracker } from './common/throttling/request-tracker';"
          if tracker_import not in a:
              marker = "import { ProgressModule } from './progress/progress.module';"
              if marker not in a:
                  raise SystemExit('progress module import marker not found')
              a = a.replace(marker, marker + '\n' + tracker_import, 1)

          old_throttle = "    ThrottlerModule.forRoot({\n      // Route-level @Throttle() overrides the default limits, so the test\n      // toggle must disable the guard itself — otherwise e2e suites hit the\n      // hard login/register limits (tests share one IP: no trust proxy).\n      skipIf: () => process.env.DISABLE_THROTTLE === '1',"
          new_throttle = "    ThrottlerModule.forRoot({\n      // Route-level @Throttle() overrides the default limits, so the test\n      // toggle must disable the guard itself — otherwise e2e suites hit the\n      // hard login/register limits (tests share one IP: no trust proxy).\n      // Normal authenticated traffic is tracked per session instead of per\n      // public IP so a school NAT cannot make unrelated users throttle each\n      // other. Login/register/reset routes stay IP-scoped.\n      getTracker: async (req) => resolveThrottleTracker(req),\n      skipIf: () => process.env.DISABLE_THROTTLE === '1',"
          if old_throttle in a:
              a = a.replace(old_throttle, new_throttle, 1)
          elif new_throttle not in a:
              raise SystemExit('throttler config marker not found')
          app.write_text(a)

          qtest = Path('client/src/tests/query-client-resilience.spec.tsx')
          qtest.write_text('/** @vitest-environment jsdom */\n\nimport { act, render, screen, waitFor } from "@testing-library/react";\nimport { beforeEach, describe, expect, it, vi } from "vitest";\n\nimport { queryClient, useQuery } from "@/lib/query-client";\n\nfunction Probe({ queryFn }: { queryFn: () => Promise<string> }) {\n  const { data, error } = useQuery({\n    queryKey: ["query-resilience"],\n    queryFn,\n    staleTime: 60_000,\n  });\n  return (\n    <div>\n      <span data-testid="data">{data ?? "none"}</span>\n      <span data-testid="error">{error instanceof Error ? error.message : "none"}</span>\n    </div>\n  );\n}\n\ndescribe("query client resilience", () => {\n  beforeEach(() => {\n    queryClient.clear();\n  });\n\n  it("does not turn a failed request into an automatic retry storm", async () => {\n    const queryFn = vi.fn().mockRejectedValue(new Error("offline"));\n    render(<Probe queryFn={queryFn} />);\n    await waitFor(() => expect(screen.getByTestId("error")).toHaveTextContent("offline"));\n    await new Promise((resolve) => setTimeout(resolve, 50));\n    expect(queryFn).toHaveBeenCalledTimes(1);\n  });\n\n  it("still refetches once when the query is explicitly invalidated", async () => {\n    const queryFn = vi.fn().mockResolvedValueOnce("first").mockResolvedValueOnce("second");\n    render(<Probe queryFn={queryFn} />);\n    await waitFor(() => expect(screen.getByTestId("data")).toHaveTextContent("first"));\n    act(() => queryClient.invalidateQueries(["query-resilience"]));\n    await waitFor(() => expect(screen.getByTestId("data")).toHaveTextContent("second"));\n    expect(queryFn).toHaveBeenCalledTimes(2);\n  });\n});\n')

          stest = Path('server/src/common/throttling/request-tracker.spec.ts')
          stest.write_text("import type { Request } from 'express';\n\nimport { resolveThrottleTracker } from './request-tracker';\n\nfunction request(input: { path: string; ip?: string; token?: string }): Request {\n  return {\n    originalUrl: input.path,\n    url: input.path,\n    ip: input.ip ?? '203.0.113.10',\n    cookies: input.token ? { ss_at: input.token } : {},\n    headers: {},\n  } as unknown as Request;\n}\n\ndescribe('resolveThrottleTracker', () => {\n  it('keeps sensitive authentication routes scoped by IP', () => {\n    const a = resolveThrottleTracker(request({ path: '/auth/login', token: 'session-a' }));\n    const b = resolveThrottleTracker(request({ path: '/api/auth/login', token: 'session-b' }));\n    expect(a).toBe('ip:203.0.113.10');\n    expect(b).toBe('ip:203.0.113.10');\n  });\n\n  it('isolates authenticated school traffic by session behind the same NAT', () => {\n    const a = resolveThrottleTracker(request({ path: '/guardian/children', token: 'session-a' }));\n    const b = resolveThrottleTracker(request({ path: '/guardian/children', token: 'session-b' }));\n    expect(a).toMatch(/^session:[a-f0-9]{64}$/);\n    expect(b).toMatch(/^session:[a-f0-9]{64}$/);\n    expect(a).not.toBe(b);\n  });\n\n  it('falls back to IP for anonymous traffic without exposing tokens', () => {\n    const anonymous = resolveThrottleTracker(request({ path: '/health' }));\n    const authenticated = resolveThrottleTracker(request({ path: '/app/data', token: 'secret-token' }));\n    expect(anonymous).toBe('ip:203.0.113.10');\n    expect(authenticated).not.toContain('secret-token');\n  });\n});\n")
          PY

      - name: Verify client query resilience
        working-directory: client
        run: |
          npm ci
          npx vitest run src/tests/query-client-resilience.spec.tsx src/tests/family-resilience-contract.spec.ts src/tests/progress-responsive-contract.spec.ts src/tests/ux-action-integrity.spec.ts
          npm run typecheck

      - name: Verify server tracker and build contract
        working-directory: server
        run: |
          npm ci
          npm run prisma:generate
          npx prisma migrate deploy
          npx jest src/common/throttling/request-tracker.spec.ts --runInBand
          npm run typecheck
          npm run build

      - name: Commit verified hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/lib/query-client.ts client/src/tests/query-client-resilience.spec.tsx server/src/app.module.ts server/src/common/throttling/request-tracker.ts server/src/common/throttling/request-tracker.spec.ts
          if git diff --cached --quiet; then
            echo "Query/throttle hardening already applied"
            exit 0
          fi
          git commit -m "fix: prevent query storms and school NAT throttling"
          git pull --rebase origin fix/school-readiness-rbac-contracts
          git push origin HEAD:fix/school-readiness-rbac-contracts
