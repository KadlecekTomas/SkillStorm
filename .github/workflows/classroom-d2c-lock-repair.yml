name: Classroom D2-C Advisory Lock Repair

on:
  push:
    branches:
      - agent/classroom-orchestration-d2c
    paths:
      - 'scripts/repair-classroom-advisory-locks.mjs'
      - 'server/prisma/migrations/20260809114500_fix_live_evidence_trigger/migration.sql'
      - '.github/workflows/classroom-d2c-lock-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skillstorm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d skillstorm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skillstorm_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/skillstorm_test
      NODE_ENV: test
      JWT_SECRET: classroom-repair-only

    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/classroom-orchestration-d2c
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - working-directory: server
        run: npm ci
      - working-directory: server
        run: npm run prisma:generate
      - working-directory: server
        run: npx prisma migrate deploy
      - run: node scripts/repair-classroom-advisory-locks.mjs
      - working-directory: server
        run: npm run typecheck
      - working-directory: server
        run: npx jest --config ./test/jest-e2e.config.js --testPathPattern='classroom-orchestration.e2e-spec.ts' --runInBand
      - name: Commit repair and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/classroom-orchestration/classroom-orchestration.service.ts
          git rm scripts/repair-classroom-advisory-locks.mjs .github/workflows/classroom-d2c-lock-repair.yml
          git commit -m "fix(classroom): execute advisory locks without row decoding"
          git push origin HEAD:agent/classroom-orchestration-d2c
