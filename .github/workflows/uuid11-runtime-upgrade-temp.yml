name: Temporary UUID 11 runtime verification

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'chore/remove-dead-typeorm'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Use Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Move explicit UUID dependency to supported CommonJS line
        shell: bash
        run: |
          set -euo pipefail
          cd server
          npm install uuid@11.1.0 --save --package-lock-only --ignore-scripts
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (pkg.dependencies?.uuid !== '^11.1.0') throw new Error(`Expected uuid ^11.1.0, got ${pkg.dependencies?.uuid}`);
          if (lock.packages?.['']?.dependencies?.uuid !== '^11.1.0') throw new Error('Lock root UUID range mismatch');
          if ('typeorm' in (pkg.dependencies ?? {}) || '@nestjs/typeorm' in (pkg.dependencies ?? {})) throw new Error('TypeORM returned');
          const typeormEntries = Object.keys(lock.packages ?? {}).filter(k => /(?:^|\/)typeorm(?:\/|$)/i.test(k));
          if (typeormEntries.length) throw new Error(`TypeORM lock entries returned: ${typeormEntries.join(', ')}`);
          NODE
          npm ci --ignore-scripts
          node -e "const { v4 } = require('uuid'); const id=v4(); if (!/^[0-9a-f-]{36}$/i.test(id)) process.exit(1); console.log('uuid 11 CommonJS runtime OK:', id)"
          npm run prisma:generate
          npm run typecheck
          npm audit --omit=dev --json > /tmp/audit-uuid11.json || true
          node -e "const r=require('/tmp/audit-uuid11.json'); console.log('runtime audit with uuid 11:', JSON.stringify(r.metadata?.vulnerabilities ?? {}))"
          git diff --check

      - name: Commit npm-generated supported UUID dependency
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/uuid11-runtime-upgrade-temp.yml
          git add server/package.json server/package-lock.json .github/workflows/uuid11-runtime-upgrade-temp.yml
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: use supported uuid runtime"
          git push origin HEAD:chore/remove-dead-typeorm
