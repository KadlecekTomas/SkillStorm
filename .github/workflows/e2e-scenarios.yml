name: E2E Scenarios

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: "20"
  DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/skillstorm_test
  JWT_SECRET: ciSyntheticAccessSecret1234567890abcdef
  JWT_ACCESS_SECRET: ciSyntheticAccessSecret1234567890abcdef
  JWT_REFRESH_SECRET: ciSyntheticRefreshSecret1234567890abcdef
  COOKIE_SECRET: ciSyntheticCookieSecret1234567890abcdef
  METRICS_INGEST_KEY: ciSyntheticMetricsKey1234567890abcdef
  CORS_ORIGINS: http://127.0.0.1:3001,http://localhost:3001
  PUBLIC_APP_URL: http://127.0.0.1:3001
  API_URL: http://127.0.0.1:4200
  API_PROXY_TARGET: http://127.0.0.1:4200
  BASE_URL: http://127.0.0.1:3001
  DISABLE_THROTTLE: "0"
  TRUST_PROXY: "1"
  DISABLE_CSRF: "1"
  CI: "true"

jobs:
  scenarios:
    name: Playwright scenarios (real browser + backend)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skillstorm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d skillstorm_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install backend dependencies
        run: npm ci --include=dev
        working-directory: server

      - name: Prisma generate
        run: npm run prisma:generate
        working-directory: server

      - name: Install frontend dependencies
        run: npm ci --include=dev
        working-directory: client

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: client

      - name: Migrate test database
        run: DATABASE_URL="$DATABASE_URL_TEST" npx prisma migrate deploy
        working-directory: server

      - name: Run scenario suite
        run: npm run test:scenarios
        working-directory: client

      - name: Upload Build a PC preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skillstorm-build-a-pc-preview
          path: client/test-results/build-a-pc-*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload Algorithm Lab walkthrough screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skillstorm-algorithm-lab-walkthrough
          path: client/test-results/algorithm-lab-*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload product proof videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skillstorm-product-proof-videos
          path: client/test-results/proof-videos/*.webm
          if-no-files-found: error
          retention-days: 14

      - name: Upload people management screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: people-management-screenshots
          path: client/test-results/people-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload whole-app release screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skillstorm-release-screenshots
          path: client/test-results/release-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload responsive visual matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skillstorm-visual-matrix
          path: client/test-results/visual-matrix/**/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scenarios-report
          path: |
            client/playwright-report-scenarios
            client/test-results
          retention-days: 7
