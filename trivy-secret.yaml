allow-rules:
  - id: prisma-live-session-index-identifiers
    description: Prisma live_session index names collide with the GoCardless live_* token heuristic; these exact identifiers are schema metadata, not credentials.
    regex: '(?:live_session_rounds_live_session_id_order_key|live_session_participants_live_session_id_idx|live_session_groups_live_session_id_label_key)'
